
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#261729">
<title>Anaya AI ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#211625;color:white;font-family:Arial}
.app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:#302036}
header{padding:18px;background:#482d49;display:flex;justify-content:space-between;align-items:center}
h2{color:#ffc6df;margin:0}
.status{font-size:12px;color:#a9edb8}
.profile{text-align:center;padding:15px}
.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover}
#chat{flex:1;overflow:auto;padding:15px}
.msg{padding:12px 15px;border-radius:18px;margin:9px 0;max-width:85%;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#523c58}
.user{background:#a84982;margin-left:auto}
.controls{display:flex;gap:8px;padding:12px;background:#482d49}
input{flex:1;min-width:0;border:0;border-radius:24px;padding:13px}
button{border:0;border-radius:24px;padding:12px;background:#dc6ba5;color:white}
.actions{display:flex;justify-content:center;gap:10px;padding:8px}
small{color:#d5bfd1}
</style>
</head>
<body>
<div class="app">
<header>
<h2>Anaya ❤️</h2>
<span class="status">● Online</span>
</header>
<div class="profile">
<img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200">
<h2>Hii jaan! 🥰</h2>
<small>Tumhari desi AI companion</small>
</div>
<div id="chat">
<div class="msg bot">Hii jaan! ❤️ Aaj tumhara din kaisa raha?</div>
</div>
<div class="actions">
<button onclick="voiceInput()">🎙️ Bolo</button>
<button onclick="speak()">🔊 Suno</button>
 <button id="callBtn" onclick="toggleCall()">
  📞 Call Anaya
</button>
<span id="callStatus">Call not started</span>

</div>
<div class="controls">
<input id="message" placeholder="Anaya se baat karo..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
</div>
<script>

let callActive = false;
let callRecognition = null;
let callSpeaking = false;
let callThinking = false;

function toggleCall() {
  if (callActive) {
    endCall();
    return;
  }

  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    alert("Please use Chrome for Anaya voice calling.");
    return;
  }

  callRecognition = new SR();
  callRecognition.lang = "hi-IN";
  callRecognition.continuous = false;
  callRecognition.interimResults = false;

  callRecognition.onresult = async (event) => {
    const spokenText = event.results[0][0].transcript;

    if (!callActive) return;

    callThinking = true;
    document.getElementById("callStatus").textContent =
      "Anaya is listening... ❤️";

    document.getElementById("message").value = spokenText;

    await send();

    if (callActive) {
      callThinking = false;
      speakCallReply();
    }
  };

  callRecognition.onend = () => {
    if (callActive && !callSpeaking && !callThinking) {
      setTimeout(startListening, 400);
    }
  };

  callActive = true;

  document.getElementById("callBtn").textContent =
    "📴 End Call";

  startListening();
}

function startListening() {
  if (!callActive || callSpeaking || callThinking) return;

  try {
    document.getElementById("callStatus").textContent =
      "🎙️ Anaya is listening...";

    callRecognition.start();
  } catch (error) {
    console.log("Listening restart:", error.message);
  }
}

function speakCallReply() {
  if (!callActive || !window.lastReply) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    window.lastReply
  );

  utterance.lang = "hi-IN";
  utterance.rate = 0.92;
  utterance.pitch = 1.12;

  callSpeaking = true;

  utterance.onend = () => {
    callSpeaking = false;

    if (callActive) {
      setTimeout(startListening, 300);
    }
  };

  utterance.onerror = () => {
    callSpeaking = false;
    if (callActive) startListening();
  };

  speechSynthesis.speak(utterance);
}

function endCall() {
  callActive = false;
  callSpeaking = false;
  callThinking = false;

  if (callRecognition) {
    callRecognition.onend = null;
    callRecognition.stop();
    callRecognition = null;
  }

  speechSynthesis.cancel();

  document.getElementById("callBtn").textContent =
    "📞 Call Anaya";

  document.getElementById("callStatus").textContent =
    "Call ended ❤️";
}

const chat=document.getElementById("chat");
let history=[];
function add(text,type){
 const d=document.createElement("div");
 d.className="msg "+type;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}
async function send(){
 const el=document.getElementById("message");
 const text=el.value.trim();
 if(!text)return;
 el.value="";
 add(text,"user");
 history.push({role:"user",content:text});
 add("Jaan, ek second... ❤️","bot");
 const loading=chat.lastChild;
 try{
   const response=await fetch("/.netlify/functions/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({messages:history.slice(-12)})
   });
   if(!response.ok)throw new Error("AI service unavailable");
   const data=await response.json();
   loading.textContent=data.reply;
   history.push({role:"assistant",content:data.reply});
   window.lastReply=data.reply;
 }catch(e){
   loading.textContent="Jaan, abhi AI connection ready nahi hai. Thodi der baad try karna. ❤️";
 }
}
function speak(){
 if(!window.lastReply)return alert("Pehle Anaya se baat karo jaan!");
 const u=new SpeechSynthesisUtterance(window.lastReply);
 u.lang="hi-IN";u.rate=.9;u.pitch=1.15;
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
}
function voiceInput(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return alert("Voice input is not supported in this browser.");
 const r=new SR();r.lang="hi-IN";
 r.onresult=e=>{
 document.getElementById("message").value=e.results[0][0].transcript;
 send();
 };
 r.start();
}
</script>
</body>
</html>
